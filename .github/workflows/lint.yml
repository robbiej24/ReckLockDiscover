name: Lint

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

jobs:
  ruff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"

      - name: Install dev deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Ruff check
        run: ruff check recklock_scanner tests

      - name: Ruff format
        run: ruff format --check recklock_scanner tests

  # Branch protection on robbiej24/ReckLockDiscover requires a check named "Lint".
  lint-pass:
    name: Lint
    runs-on: ubuntu-latest
    needs: ruff
    if: always()
    steps:
      - name: Require ruff success
        run: |
          if [ "${{ needs.ruff.result }}" != "success" ]; then
            echo "ruff result: ${{ needs.ruff.result }}"
            exit 1
          fi
