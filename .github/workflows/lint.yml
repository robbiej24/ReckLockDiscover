name: Lint

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  ruff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dev deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Ruff check
        run: ruff check recklock_scanner tests

      - name: Ruff format
        run: ruff format --check recklock_scanner tests

  # Branch protection on robbiej24/ReckLockDiscover requires a check named "Lint".
  lint-pass:
    name: Lint
    runs-on: ubuntu-latest
    needs: ruff
    if: always()
    steps:
      - name: Require ruff success
        run: |
          if [ "${{ needs.ruff.result }}" != "success" ]; then
            echo "ruff result: ${{ needs.ruff.result }}"
            exit 1
          fi
