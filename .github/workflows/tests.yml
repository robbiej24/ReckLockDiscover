name: Tests

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.14"]
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package & dev deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Run tests
        run: pytest

  # Branch protection on robbiej24/ReckLockDiscover requires a check named "Tests".
  tests-pass:
    name: Tests
    runs-on: ubuntu-latest
    needs: pytest
    if: always()
    steps:
      - name: Require pytest matrix success
        run: |
          if [ "${{ needs.pytest.result }}" != "success" ]; then
            echo "pytest matrix result: ${{ needs.pytest.result }}"
            exit 1
          fi
